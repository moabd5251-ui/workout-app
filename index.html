<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#20241F">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Workout Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap');
  :root{
    --paper:#F7F6F2; --ink:#20241F; --sage:#8FA58B; --pine:#3C5236;
    --chalk:#E9E7DF; --signal:#C99A1C; --card:#FFFFFF; --line:#E2E0D8;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5;}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 80px;}

  header{
    background:var(--ink);
    background-image:radial-gradient(circle at 15% 35%, rgba(247,246,242,.15) 1px, transparent 1.6px),
                     radial-gradient(circle at 55% 75%, rgba(201,154,28,.32) 1px, transparent 1.6px),
                     radial-gradient(circle at 85% 30%, rgba(247,246,242,.13) 1px, transparent 1.6px);
    background-size:90px 90px,130px 130px,110px 110px;
    color:var(--paper);padding:26px 14px 20px;margin-bottom:14px;
  }
  header .inner{max-width:640px;margin:0 auto;}
  .eyebrow{font-family:'Barlow Condensed';font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--signal);}
  h1{font-family:'Barlow Condensed';font-weight:700;font-size:32px;text-transform:uppercase;line-height:1.05;}
  #dateline{font-size:12.5px;color:var(--chalk);margin-top:4px;}

  .tabs{display:flex;gap:6px;max-width:640px;margin:0 auto 16px;padding:0 14px;overflow-x:auto;}
  .tab{
    flex:1;min-width:82px;border:1.5px solid var(--ink);background:var(--card);
    border-radius:8px;padding:8px 6px;text-align:center;cursor:pointer;
    font-family:'Barlow Condensed';font-weight:700;font-size:16px;text-transform:uppercase;
    color:var(--ink);
  }
  .tab small{display:block;font-family:'Inter';font-weight:600;font-size:10px;text-transform:none;opacity:.6;}
  .tab.active{background:var(--pine);border-color:var(--pine);color:#fff;}
  .tab.active small{opacity:.85;}

  .status{font-size:12.5px;color:var(--pine);margin:0 0 12px;min-height:18px;}

  .ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
  .ex h3{font-family:'Barlow Condensed';font-weight:700;font-size:19px;text-transform:uppercase;}
  .scheme{font-size:11.5px;font-weight:600;color:var(--pine);background:rgba(143,165,139,.18);border-radius:4px;padding:2px 7px;white-space:nowrap;}
  .last{font-size:12px;color:#6B6F68;margin:4px 0 8px;}
  .last b{color:var(--ink);}

  .setrow{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .setnum{font-family:'Barlow Condensed';font-weight:700;font-size:14px;width:38px;color:#8a8d86;text-transform:uppercase;}
  .setrow input{
    width:76px;padding:9px 8px;border:1.5px solid var(--line);border-radius:7px;
    font:600 16px 'Inter';color:var(--ink);background:#FBFAF7;text-align:center;
  }
  .setrow input:focus{outline:none;border-color:var(--pine);background:#fff;}
  .unit{font-size:11.5px;color:#8a8d86;width:26px;}
  .x{color:#8a8d86;font-weight:600;}
  .addset{
    background:none;border:1.5px dashed var(--sage);color:var(--pine);border-radius:7px;
    padding:6px 12px;font:600 12.5px 'Inter';cursor:pointer;margin-top:2px;
  }
  .badge{
    display:none;margin-top:8px;font-size:12.5px;font-weight:600;color:#7A4A12;
    background:rgba(201,154,28,.16);border-radius:6px;padding:6px 10px;
  }
  .badge.show{display:block;}

  .savebar{
    position:sticky;bottom:0;background:linear-gradient(transparent, var(--paper) 30%);
    padding:16px 0 14px;display:flex;gap:10px;
  }
  .btn{
    flex:1;border:none;border-radius:9px;padding:14px;cursor:pointer;
    font-family:'Barlow Condensed';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;
  }
  .btn.primary{background:var(--pine);color:#fff;}
  .btn.primary:active{background:#2c3d28;}
  .btn.ghost{flex:0 0 auto;background:var(--card);border:1.5px solid var(--ink);color:var(--ink);padding:14px 16px;}

  .history{margin-top:8px;}
  .history h2{font-family:'Barlow Condensed';font-weight:700;font-size:20px;text-transform:uppercase;color:var(--pine);border-bottom:2px solid var(--pine);padding-bottom:4px;margin-bottom:10px;}
  .sess{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:12px 14px;margin-bottom:8px;font-size:13px;}
  .sess .d{font-weight:700;font-family:'Barlow Condensed';font-size:15px;text-transform:uppercase;margin-bottom:4px;}
  .sess div.row{color:#4c4f49;margin-bottom:2px;}
  .empty{font-size:13px;color:#8a8d86;padding:6px 0;}

  /* cardio tab */
  .cardio-form label{display:block;font-size:12.5px;font-weight:600;color:var(--pine);margin:10px 0 4px;}
  .cardio-form select,.cardio-form input,.cardio-form textarea{
    width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;
    font:600 15px 'Inter';color:var(--ink);background:#FBFAF7;
  }
  .cardio-form textarea{font-weight:400;min-height:64px;resize:vertical;}
  .cardio-form select:focus,.cardio-form input:focus,.cardio-form textarea:focus{outline:none;border-color:var(--pine);background:#fff;}
  .loading{font-size:13px;color:#8a8d86;padding:20px 0;text-align:center;}

  .ex select{width:100%;padding:10px;border:1.5px solid var(--line);border-radius:8px;font:600 14px 'Inter';background:#FBFAF7;color:var(--ink);margin:6px 0 10px;}
  .ex select:focus{outline:none;border-color:var(--pine);}
  .ex canvas{display:block;margin-top:6px;}

  #profbar{max-width:640px;margin:-4px auto 12px;padding:0 14px;display:flex;gap:8px;align-items:center;}
  #profbar .plabel{font-family:'Barlow Condensed';font-weight:700;font-size:14px;text-transform:uppercase;color:var(--pine);}
  #profbar select,#profbar input{flex:1;min-width:0;padding:9px;border:1.5px solid var(--line);border-radius:8px;font:600 14px 'Inter';background:#fff;color:var(--ink);}
  #profbar button{background:var(--pine);color:#fff;border:none;border-radius:8px;padding:9px 12px;font:600 13px 'Inter';cursor:pointer;white-space:nowrap;}
  #profbar #profCancel{background:var(--card);color:var(--ink);border:1.5px solid var(--ink);}

  /* exercise demo modal */
  .ex h3{cursor:pointer;text-decoration:underline;text-decoration-color:var(--sage);text-decoration-thickness:2px;text-underline-offset:3px;}
  #ovl{position:fixed;inset:0;background:rgba(32,36,31,.55);display:none;z-index:50;}
  #ovl.open{display:flex;align-items:flex-end;justify-content:center;}
  #modal{background:var(--paper);border-radius:16px 16px 0 0;width:100%;max-width:640px;max-height:86vh;overflow-y:auto;padding:18px 18px 26px;}
  #modal .top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:2px;}
  #modal h3{font-family:'Barlow Condensed';font-weight:700;font-size:24px;text-transform:uppercase;}
  #mClose{border:none;background:var(--chalk);border-radius:50%;width:38px;height:38px;font-size:17px;font-weight:700;cursor:pointer;color:var(--ink);flex:0 0 auto;}
  #modal ul{list-style:none;margin:10px 0;}
  #modal li{padding-left:18px;position:relative;margin-bottom:7px;font-size:14.5px;}
  #modal li::before{content:"";position:absolute;left:0;top:9px;width:8px;height:3px;background:var(--signal);}
  #modal .watch{font-size:13.5px;color:#7A4A12;background:rgba(201,154,28,.14);border-radius:7px;padding:8px 11px;margin:8px 0 14px;}
  .vidbtn{display:block;text-align:center;background:var(--pine);color:#fff;text-decoration:none;border-radius:9px;padding:14px;font-family:'Barlow Condensed';font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.04em;}
  .vidbtn.alt{background:var(--card);color:var(--pine);border:1.5px solid var(--pine);margin-top:8px;padding:11px;font-size:16px;}
  #modal .nav{display:flex;gap:10px;margin-top:12px;}
  #modal .nav button{flex:1;background:var(--card);border:1.5px solid var(--ink);border-radius:9px;padding:11px;font:600 13.5px 'Inter';cursor:pointer;color:var(--ink);}
</style>
</head>
<body>
<header>
  <div class="inner">
    <div class="eyebrow">5-Day Program</div>
    <h1>Workout Log</h1>
    <div id="dateline"></div>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<div class="wrap">
  <div class="status" id="status"></div>
  <div id="content"><div class="loading">Loading your log…</div></div>
</div>

<script>
const PLAN = {
  A:{label:"Mon", name:"Strength A", exercises:[
    {n:"Goblet Squat", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Incline DB Press", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Lat Pulldown", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"DB Romanian Deadlift", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Neutral-Grip DB Press", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Plank", sets:3, lo:20, hi:40, unit:"sec", bodyweight:true},
  ]},
  B:{label:"Wed", name:"Strength B", exercises:[
    {n:"Leverage Squat", sets:3, lo:10, hi:15, unit:"lb"},
    {n:"DB Bench Press", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Seated Cable Row", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Step-Up / Rev Lunge", sets:3, lo:8, hi:10, unit:"lb", perSide:true},
    {n:"EZ Bar Curl", sets:2, lo:10, hi:15, unit:"lb"},
    {n:"Triceps Pressdown", sets:2, lo:10, hi:15, unit:"lb"},
  ]},
  C:{label:"Fri", name:"Strength C", exercises:[
    {n:"DB Deadlift", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Chest Press", sets:3, lo:8, hi:12, unit:"lb"},
    {n:"Assisted Pull-Up", sets:3, lo:6, hi:10, unit:"lb", note:"weight = band/assist"},
    {n:"Split Squat", sets:3, lo:8, hi:10, unit:"lb", perSide:true},
    {n:"Face Pull", sets:2, lo:12, hi:15, unit:"lb"},
    {n:"Cable Woodchop", sets:2, lo:10, hi:10, unit:"lb", perSide:true},
  ]},
  H:{label:"Any", name:"Bodyweight", exercises:[
    {n:"Chair Squat", sets:3, lo:10, hi:15, unit:"lb", bodyweight:true},
    {n:"Incline Push-Up", sets:3, lo:8, hi:12, unit:"lb", bodyweight:true},
    {n:"Towel Row", sets:3, lo:10, hi:15, unit:"lb", bodyweight:true},
    {n:"Glute Bridge", sets:3, lo:12, hi:15, unit:"lb", bodyweight:true},
    {n:"Stair Step-Up", sets:3, lo:8, hi:10, unit:"lb", perSide:true, bodyweight:true},
    {n:"Home Plank", sets:3, lo:20, hi:40, unit:"sec", bodyweight:true},
    {n:"Home Dead Bug", sets:3, lo:10, hi:10, unit:"lb", perSide:true, bodyweight:true},
  ]},
  PL:{label:"Recovery", name:"Pilates", exercises:[
    {n:"Pelvic Tilt", sets:1, lo:10, hi:10, unit:"lb", bodyweight:true},
    {n:"Toe Taps", sets:1, lo:8, hi:8, unit:"lb", perSide:true, bodyweight:true},
    {n:"Bridge Articulation", sets:1, lo:8, hi:8, unit:"lb", bodyweight:true},
    {n:"Modified Hundred", sets:1, lo:50, hi:100, unit:"lb", bodyweight:true},
    {n:"Side-Lying Leg Lift", sets:1, lo:10, hi:10, unit:"lb", perSide:true, bodyweight:true},
    {n:"Bird Dog", sets:1, lo:8, hi:8, unit:"lb", perSide:true, bodyweight:true},
    {n:"Swimming Prep", sets:1, lo:8, hi:8, unit:"lb", perSide:true, bodyweight:true},
    {n:"Child's Pose", sets:1, lo:30, hi:60, unit:"sec", bodyweight:true},
  ]},
};
const CARDIO_KEY = "wlog-cardio";
const BODY_KEY = "wlog-body";
const GLP_KEY = "wlog-glp1";
const DRAFT_KEY = "wlog-draft";
const dayKey = d => "wlog-day-" + d;
let active = "A";
let cache = {};           // dayId -> sessions array (newest first)
let cardioCache = null;

const $ = s => document.querySelector(s);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = iso => new Date(iso+"T12:00:00").toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});

$("#dateline").textContent = new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});

/* ---------- storage helpers (saves to this phone's browser) ---------- */
async function rawGet(key){
  try{ return localStorage.getItem(key); }catch(e){ return null; }
}
async function rawSet(key, val){
  try{ localStorage.setItem(key, val); return true; }catch(e){ console.error(e); return false; }
}

/* ---------- backup / restore (all people included) ---------- */
function exportData(){
  const dump = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf("wlog") !== -1){
      try{ dump[k] = JSON.parse(localStorage.getItem(k)); }
      catch(e){ dump[k] = localStorage.getItem(k); }
    }
  }
  const blob = new Blob([JSON.stringify(dump,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "workout-log-backup-"+todayISO()+".json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(input){
  const f = input.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try{
      const dump = JSON.parse(rd.result);
      for(const [k,v] of Object.entries(dump)) localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v));
      await loadProfiles();
      drawProfileBar();
      resetCaches();
      setStatus("Backup restored \u2713");
      render();
    }catch(e){ setStatus("Couldn't read that backup file.", false); }
  };
  rd.readAsText(f);
}

/* ---------- people / profiles ---------- */
const PROF_KEY = "wlog-profiles";
let PROFILES = {list:[{id:"default", name:"Client 1"}], active:"default"};
function pk(key){ return PROFILES.active==="default" ? key : "u-"+PROFILES.active+"-"+key; }
async function loadProfiles(){
  const v = await rawGet(PROF_KEY);
  if(v){ try{ const p = JSON.parse(v); if(p && p.list && p.list.length) PROFILES = p; }catch(e){} }
}
async function saveProfiles(){ return rawSet(PROF_KEY, JSON.stringify(PROFILES)); }
function resetCaches(){ cache = {}; cardioCache = null; bodyCache = null; glpCache = null; }
function buildProfileBar(){
  const bar = document.createElement("div");
  bar.id = "profbar";
  document.querySelector("header").after(bar);
  drawProfileBar();
}
function drawProfileBar(){
  const bar = document.getElementById("profbar");
  let opts = "";
  for(const p of PROFILES.list) opts += '<option value="'+p.id+'"'+(p.id===PROFILES.active?' selected':'')+'>'+p.name+'</option>';
  const modeLabel = activeProfile().mode === "home" ? "No gym" : "Gym";
  bar.innerHTML = '<span class="plabel">Person</span><select id="profSel">'+opts+'</select><button id="profMode" title="Switch between gym and no-gym program">'+modeLabel+'</button><button id="profAdd">+ Add</button>';
  document.getElementById("profSel").onchange = async e => {
    PROFILES.active = e.target.value;
    await saveProfiles();
    resetCaches();
    renderTabs();
    drawProfileBar();
    render();
  };
  document.getElementById("profMode").onclick = async () => {
    const p = activeProfile();
    p.mode = p.mode === "home" ? "gym" : "home";
    await saveProfiles();
    drawProfileBar();
    renderTabs();
    render();
  };
  document.getElementById("profAdd").onclick = () => {
    bar.innerHTML = '<span class="plabel">Name</span><input id="profName" type="text" placeholder="e.g. Mike R." maxlength="30">'
      + '<button id="profSave">Save</button><button id="profCancel">Cancel</button>';
    document.getElementById("profSave").onclick = async () => {
      const name = document.getElementById("profName").value.trim();
      if(!name){ drawProfileBar(); return; }
      const id = Date.now().toString(36);
      PROFILES.list.push({id:id, name:name});
      PROFILES.active = id;
      await saveProfiles();
      resetCaches();
      drawProfileBar();
      renderTabs();
      render();
    };
    document.getElementById("profCancel").onclick = drawProfileBar;
    document.getElementById("profName").focus();
  };
}
async function loadKey(key){
  const v = await rawGet(pk(key));
  if(v){ try{ return JSON.parse(v); }catch(e){} }
  return [];
}
async function saveKey(key, arr){
  return rawSet(pk(key), JSON.stringify(arr.slice(0,40)));
}

/* ---------- tabs ---------- */
function activeProfile(){ return PROFILES.list.find(p=>p.id===PROFILES.active) || PROFILES.list[0]; }
function renderTabs(){
  const t = $("#tabs"); t.innerHTML = "";
  const mode = activeProfile().mode === "home" ? "home" : "gym";
  const gym = [["A","Mon","Strength A"],["B","Wed","Strength B"],["C","Fri","Strength C"],["PL","Recovery","Pilates"],["X","Tue/Thu","Cardio"],["P","Track","Progress"],["G","Daily","GLP-1"]];
  const home = [["H","Any day","Bodyweight"],["PL","Recovery","Pilates"],["X","Off days","Cardio"],["P","Track","Progress"],["G","Daily","GLP-1"]];
  const items = mode === "home" ? home : gym;
  if(!items.some(x=>x[0]===active)) active = items[0][0];
  for(const [id,small,big] of items){
    const b = document.createElement("div");
    b.className = "tab" + (active===id ? " active" : "");
    b.innerHTML = big.replace("Strength ","Day ") + "<small>"+small+"</small>";
    b.onclick = () => { active = id; renderTabs(); render(); };
    t.appendChild(b);
  }
}

/* ---------- strength day ---------- */
async function ensureDay(d){
  if(!(d in cache)) cache[d] = await loadKey(dayKey(d));
  return cache[d];
}

function setStatus(msg, ok=true){
  const s = $("#status");
  s.textContent = msg;
  s.style.color = ok ? "var(--pine)" : "#8a3b1f";
  if(msg) setTimeout(()=>{ if(s.textContent===msg) s.textContent=""; }, 3500);
}

function lastSessionFor(sessions){
  return sessions.find(s => s.d !== todayISO()) || null;
}

async function renderDay(d){
  const c = $("#content");
  c.innerHTML = '<div class="loading">Loading…</div>';
  const sessions = await ensureDay(d);
  const today = sessions.find(s => s.d === todayISO());
  let draftE = null;
  if(!today){
    const dr = await loadKey(DRAFT_KEY);
    if(dr && !Array.isArray(dr) && dr.d === todayISO() && dr.day === d) draftE = dr.e;
  }
  const prev = lastSessionFor(sessions);
  const plan = PLAN[d];

  let html = "";
  for(const ex of plan.exercises){
    const prevSets = prev && prev.e[ex.n] ? prev.e[ex.n] : null;
    const todaySets = today && today.e[ex.n] ? today.e[ex.n] : (draftE && draftE[ex.n] ? draftE[ex.n] : null);
    const nSets = Math.max(ex.sets, todaySets ? todaySets.length : 0);
    const repsLabel = ex.unit==="sec" ? "sec" : "reps";
    let lastTxt = "First time — pick a weight you could do ~15 reps with, log what you get.";
    let goUp = false;
    if(prevSets){
      const w = [...new Set(prevSets.map(s=>s[0]).filter(v=>v!==""&&v!=null))].join("/") || "—";
      const r = prevSets.map(s=>s[1]).filter(v=>v!==""&&v!=null).join(", ") || "—";
      lastTxt = "Last time ("+fmtDate(prev.d)+"): <b>"+(ex.bodyweight?"":w+" "+ex.unit+" × ")+r+" "+repsLabel+"</b>";
      const reps = prevSets.map(s=>parseFloat(s[1])).filter(v=>!isNaN(v));
      goUp = reps.length >= ex.sets && reps.every(v => v >= ex.hi) && !ex.bodyweight;
    }
    html += '<div class="ex" data-ex="'+encodeURIComponent(ex.n)+'">'
      + '<div class="ex-head"><h3 onclick="openEx(\''+d+'\','+plan.exercises.indexOf(ex)+')">'+ex.n+' <span style="font-size:13px;color:var(--pine)">▸</span></h3>'
      + '<span class="scheme">'+ex.sets+' × '+ex.lo+'–'+ex.hi+' '+repsLabel+(ex.perSide?" /side":"")+'</span></div>'
      + '<div class="last">'+lastTxt+(ex.note ? ' <i>('+ex.note+')</i>':'')+'</div>';
    for(let i=0;i<nSets;i++){
      const tv = todaySets && todaySets[i] ? todaySets[i] : ["",""];
      const pv = prevSets && prevSets[i] ? prevSets[i] : ["",""];
      html += '<div class="setrow"><span class="setnum">Set '+(i+1)+'</span>';
      if(!ex.bodyweight){
        html += '<input type="number" inputmode="decimal" class="w" placeholder="'+(pv[0]??"")+'" value="'+(tv[0]??"")+'"><span class="unit">'+ex.unit+'</span><span class="x">×</span>';
      }
      html += '<input type="number" inputmode="numeric" class="r" placeholder="'+(pv[1]??"")+'" value="'+(tv[1]??"")+'"><span class="unit">'+repsLabel+'</span></div>';
    }
    html += '<button class="addset" onclick="addSet(this)">+ add set</button>';
    html += '<div class="badge'+(goUp?' show':'')+'">All sets hit the top of the range last time — go up to the next weight today.</div>';
    html += '</div>';
  }
  html += '<div class="savebar"><button class="btn primary" onclick="saveDay()">'+(today?'Update today\'s workout':'Save workout')+'</button>'
        + '<button class="btn ghost" onclick="clearInputs()">Clear</button></div>';

  // history
  html += '<div class="history"><h2>History — '+plan.name+'</h2>';
  const past = sessions.slice(0,8);
  if(past.length===0) html += '<div class="empty">No sessions logged yet.</div>';
  for(const s of past){
    html += '<div class="sess"><div class="d">'+fmtDate(s.d)+'</div>';
    for(const [name,sets] of Object.entries(s.e)){

function addSet(btn){
  const card = btn.closest(".ex");
  const rows = card.querySelectorAll(".setrow");
  const n = rows.length + 1;
  const hasW = rows[0].querySelector(".w") !== null;
  const unitTxt = rows[0].querySelectorAll(".unit");
  const repUnit = unitTxt[unitTxt.length-1].textContent;
  const div = document.createElement("div");
  div.className = "setrow";
  div.innerHTML = '<span class="setnum">Set '+n+'</span>'
    + (hasW ? '<input type="number" inputmode="decimal" class="w" placeholder=""><span class="unit">lb</span><span class="x">×</span>' : '')
    + '<input type="number" inputmode="numeric" class="r" placeholder=""><span class="unit">'+repUnit+'</span>';

function collectDay(){
  const data = {};
  document.querySelectorAll(".ex").forEach(card => {
    const name = decodeURIComponent(card.dataset.ex);
    const sets = [];
    card.querySelectorAll(".setrow").forEach(row => {
      const w = row.querySelector(".w"); const r = row.querySelector(".r");
      sets.push([w ? w.value : "", r ? r.value : ""]);
    });
    if(sets.some(s => s[0]!=="" || s[1]!=="")) data[name] = sets;
  });
  return data;
}

async function saveDay(){
  const data = collectDay();
  if(Object.keys(data).length===0){ setStatus("Nothing to save yet — log at least one set.", false); return; }
  const sessions = await ensureDay(active);
  const idx = sessions.findIndex(s => s.d === todayISO());
  const entry = {d: todayISO(), e: data};
  if(idx >= 0) sessions[idx] = entry; else sessions.unshift(entry);
  const ok = await saveKey(dayKey(active), sessions);
  if(ok){ cache[active] = sessions; rawSet(pk(DRAFT_KEY), "{}"); setStatus("Saved ✓ — nice work."); renderDay(active); }
  else setStatus("Couldn't save — check connection and try again.", false);
}

function drawChart(id, pts){
  const cv = document.getElementById(id); if(!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight, dpr = 2;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,w,h);
  if(pts.length < 2){
    ctx.fillStyle = "#8a8d86"; ctx.font = "13px Inter, sans-serif";
    ctx.fillText("Log at least two entries to see a trend line.", 8, h/2);
    return;
  }
  const ys = pts.map(p=>p.y);
  let min = Math.min(...ys), max = Math.max(...ys);
  const pad = (max-min || 1) * 0.2; min -= pad; max += pad;
  const L = 40, R = 10, T = 10, B = 22;
  const X = i => L + i/(pts.length-1)*(w-L-R);
  const Y = v => T + (1-(v-min)/(max-min))*(h-T-B);
  ctx.strokeStyle = "#E2E0D8"; ctx.fillStyle = "#8a8d86"; ctx.font = "10px Inter, sans-serif"; ctx.lineWidth = 1;
  for(let g=0; g<3; g++){
    const v = min + (max-min)*g/2, y = Y(v);
    ctx.beginPath(); ctx.moveTo(L, y); ctx.lineTo(w-R, y); ctx.stroke();
    ctx.fillText(String(Math.round(v*10)/10), 4, y+3);
  }
  ctx.fillText(fmtDate(pts[0].d), L, h-6);
  const lastLbl = fmtDate(pts[pts.length-1].d);
  ctx.fillText(lastLbl, w-R-ctx.measureText(lastLbl).width, h-6);
  ctx.strokeStyle = "#3C5236"; ctx.lineWidth = 2.5; ctx.beginPath();
  pts.forEach((p,i)=> i ? ctx.lineTo(X(i),Y(p.y)) : ctx.moveTo(X(0),Y(p.y)));
  ctx.stroke();
  pts.forEach((p,i)=>{
    ctx.fillStyle = i===pts.length-1 ? "#C99A1C" : "#3C5236";
    ctx.beginPath(); ctx.arc(X(i), Y(p.y), i===pts.length-1?4:3, 0, 7); ctx.fill();
  });
}
function drawBody(){
  const pts = bodyCache.slice().reverse().map(b=>({d:b.d, y:parseFloat(b.w)})).filter(p=>!isNaN(p.y));
  drawChart("bwChart", pts);
  const cap = $("#bwCap"); if(!cap) return;
  if(pts.length>=2){
    const diff = Math.round((pts[pts.length-1].y - pts[0].y)*10)/10;
    let t = "<b>"+pts[0].y+" \u2192 "+pts[pts.length-1].y+" lb ("+(diff>0?"+":"")+diff+" lb)</b>";
    const was = bodyCache.slice().reverse().map(b=>parseFloat(b.wa)).filter(v=>!isNaN(v));
    if(was.length>=2){
      const wd = Math.round((was[was.length-1]-was[0])*10)/10;
      t += " \u00b7 Waist: "+was[0]+" \u2192 "+was[was.length-1]+" in ("+(wd>0?"+":"")+wd+")";
    }
    cap.innerHTML = t + "<br>A good pace is roughly 0.5\u20131% of body weight per week \u2014 slower is fine if strength is climbing.";
  } else cap.textContent = "Weigh in weekly \u2014 trends matter, single days don't.";
}
function strengthPoints(name){
  let day = "A", def = null;
  for(const d of ["A","B","C","H","PL"]){ const f = PLAN[d].exercises.find(e=>e.n===name); if(f){ day = d; def = f; } }
  const idx = def && def.bodyweight ? 1 : 0;
  const pts = [];
  for(const s of (cache[day]||[]).slice().reverse()){
    const sets = s.e[name]; if(!sets) continue;
    const vals = sets.map(x=>parseFloat(x[idx])).filter(v=>!isNaN(v));
    if(vals.length) pts.push({d:s.d, y:Math.max(...vals)});
  }
  return {pts: pts, unit: def && def.bodyweight ? "sec" : "lb"};
}
function drawStrength(){
  const sel = $("#exSel"); if(!sel) return;
  const res = strengthPoints(sel.value);
  drawChart("stChart", res.pts);
  const cap = $("#stCap"); if(!cap) return;
  if(res.pts.length>=2){
    const p = res.pts;
    const diff = Math.round((p[p.length-1].y - p[0].y)*10)/10;
    cap.innerHTML = "Top set: <b>"+p[0].y+" \u2192 "+p[p.length-1].y+" "+res.unit+"</b> ("+(diff>0?"+":"")+diff+") across "+p.length+" sessions.";
  } else cap.textContent = "Charts appear after two logged sessions of this exercise.";
}

/* ---------- GLP-1 dose tracker ---------- */
const GLP_MEDS = [
  {n:"Semaglutide (Ozempic / Wegovy / Rybelsus / compounded)", hl:7},
  {n:"Tirzepatide (Mounjaro / Zepbound)", hl:5},
  {n:"Dulaglutide (Trulicity)", hl:4.7},
  {n:"Liraglutide (Saxenda / Victoza)", hl:0.55},
  {n:"Exenatide (Byetta)", hl:0.1},
  {n:"Custom \u2014 enter half-life manually", hl:null}
];
let glpCache = null;
function glpNorm(v){ return (v && !Array.isArray(v)) ? v : {target:"", hl:"1", med:"5", win:"5", doses:[]}; }
function glpResidual(doses, hl, win){
  const now = new Date(todayISO()+"T12:00:00");
  let r = 0; const rows = [];
  for(const x of doses){
    const ago = Math.round((now - new Date(x.d+"T12:00:00"))/86400000);
    if(ago < 1 || ago > win) continue;
    const rem = parseFloat(x.mg) * Math.pow(0.5, ago/hl);
    if(!isNaN(rem)){ r += rem; rows.push({d:x.d, mg:x.mg, ago:ago, rem:rem}); }
  }
  rows.sort((a,b)=>a.ago-b.ago);
  return {r:r, rows:rows};
}
const rnd = v => Math.round(v*1000)/1000;
function glpMedChange(){
  const i = parseInt($("#gM").value);
  const m = GLP_MEDS[i];
  if(m && m.hl !== null){ $("#gH").value = m.hl; $("#gH").readOnly = true; }
  else { $("#gH").readOnly = false; $("#gH").focus(); }
}
async function renderGlp(){
  const c = $("#content");
  c.innerHTML = '<div class="loading">Loading\u2026</div>';
  if(glpCache===null) glpCache = glpNorm(await loadKey(GLP_KEY));
  const hl = parseFloat(glpCache.hl) || 1;
  const win = parseInt(glpCache.win) || 5;
  const target = parseFloat(glpCache.target);
  const res = glpResidual(glpCache.doses, hl, win);
  const todayDose = glpCache.doses.find(x=>x.d===todayISO());
  const rec = !isNaN(target) ? Math.max(0, target - res.r) : null;
  const medIdx = glpCache.med !== undefined ? parseInt(glpCache.med) : 5;
  let medOpts = "";
  GLP_MEDS.forEach((m,i)=>{ medOpts += '<option value="'+i+'"'+(i===medIdx?' selected':'')+'>'+m.n+'</option>'; });
  const isCustom = GLP_MEDS[medIdx] && GLP_MEDS[medIdx].hl === null;
  let rows = "";
  for(const x of res.rows){
    rows += '<div class="row"><b>'+fmtDate(x.d)+'</b> ('+x.ago+'d ago): took '+x.mg+' \u2192 <b>'+rnd(x.rem)+'</b> still active</div>';
  }
  if(!rows) rows = '<div class="row">No doses logged in the window.</div>';
  c.innerHTML =
    '<div class="ex"><div class="ex-head"><h3>Dose Settings</h3><span class="scheme">units = whatever you dose in</span></div>'
    + '<label style="display:block;font-size:12.5px;font-weight:600;color:var(--pine);margin:6px 0 2px">Medication</label>'
    + '<select id="gM" onchange="glpMedChange()">'+medOpts+'</select>'
    + '<label style="display:block;font-size:12.5px;font-weight:600;color:var(--pine);margin:2px 0 2px">Decay window</label>'
    + '<select id="gW"><option value="5"'+(win===5?' selected':'')+'>5 days</option><option value="35"'+(win===35?' selected':'')+'>5 weeks</option></select>'
    + '<div class="setrow"><span class="setnum" style="width:110px">Target level</span><input id="gT" type="number" inputmode="decimal" step="any" value="'+(glpCache.target||"")+'"></div>'
    + '<div class="setrow"><span class="setnum" style="width:110px">Half-life (days)</span><input id="gH" type="number" inputmode="decimal" step="any" value="'+(glpCache.hl||"1")+'"'+(isCustom?'':' readonly')+'></div>'
    + '<div class="last">Half-life fills in automatically from the medication (verify against the package insert or ask the pharmacist). Slow drugs like semaglutide and tirzepatide need the <b>5-week</b> window \u2014 5 days misses most of what\'s still in the body.</div>'
    + '<button class="btn primary" style="width:100%;margin-top:4px" onclick="saveGlpSettings()">Save settings</button></div>'

    + '<div class="ex"><div class="ex-head"><h3>Today</h3><span class="scheme">'+fmtDate(todayISO())+'</span></div>'
    + '<div class="last">Still active from the last '+win+' days: <b>'+rnd(res.r)+'</b>'
    + (rec!==null ? '<br>To reach your target of '+target+', take: <b style="font-size:16px">'+rnd(rec)+'</b>' : '<br>Set a target level above to get a suggested top-up.')
    + (todayDose ? '<br>Logged today: <b>'+todayDose.mg+'</b> \u2192 level now \u2248 <b>'+rnd(res.r+parseFloat(todayDose.mg||0))+'</b>' : '')
    + '</div>'
    + '<div class="setrow"><span class="setnum" style="width:110px">Dose taken</span><input id="gD" type="number" inputmode="decimal" step="any" value="'+(todayDose?todayDose.mg:(rec!==null?rnd(rec):""))+'"></div>'
    + '<button class="btn primary" style="width:100%;margin-top:4px" onclick="saveGlpDose()">'+(todayDose?'Update today\'s dose':'Log today\'s dose')+'</button></div>'

    + '<div class="ex"><h3>'+(win===35?'5-Week':'5-Day')+' Breakdown</h3><div class="last">Each dose halves every '+hl+' day(s):</div>'+rows
    + '<div class="last" style="margin-top:8px">This is simple math on the numbers you enter \u2014 not medical advice. The dose amounts, target level, and schedule belong to the prescribing doctor.</div></div>';
}
async function saveGlpSettings(){
  glpCache.med = $("#gM").value;
  glpCache.win = $("#gW").value;
  glpCache.target = $("#gT").value;
  glpCache.hl = $("#gH").value || "1";

async function saveGlpDose(){
  const mg = $("#gD").value;
  if(mg===""){ setStatus("Enter the dose you took.", false); return; }
  const i = glpCache.doses.findIndex(x=>x.d===todayISO());

  if(ok){ setStatus("Dose logged \u2713"); renderGlp(); }
}
async function saveGlpStore(){
  const ok = await rawSet(pk(GLP_KEY), JSON.stringify(glpCache));
  if(!ok) setStatus("Couldn't save \u2014 try again.", false);
  return ok;
}

 "Split Squat":{q:"dumbbell split squat proper form",cues:["Staggered stance, hips square, torso tall.","Back knee drops straight down; front shin stays vertical.","Push through the front heel; hold the rack for balance if needed."],watch:"Front knee lunging far past the toes."},

let mDay = "A", mIdx = 0;
function openEx(d, i){ mDay = d; mIdx = i; showEx(); document.getElementById("ovl").classList.add("open"); }
function closeEx(){ document.getElementById("ovl").classList.remove("open"); }
function navEx(dir){
  const n = PLAN[mDay].exercises.length;
  mIdx = (mIdx + dir + n) % n;
  showEx();
}
function showEx(){
  const list = PLAN[mDay].exercises;
  const ex = list[mIdx];
  const c = CUES[ex.n] || {q: ex.n + " exercise form", cues: [], watch: ""};
  const prevN = list[(mIdx - 1 + list.length) % list.length].n;
  const nextN = list[(mIdx + 1) % list.length].n;
  const repsLabel = ex.unit === "sec" ? "sec" : "reps";
  document.getElementById("modal").innerHTML =
    '<div class="top"><h3>' + ex.n + '</h3><button id="mClose" onclick="closeEx()">✕</button></div>'
    + '<span class="scheme">' + ex.sets + ' × ' + ex.lo + '–' + ex.hi + ' ' + repsLabel + (ex.perSide ? " /side" : "") + '</span>'
    + '<ul>' + c.cues.map(x => '<li>' + x + '</li>').join('') + '</ul>'
    + (c.watch ? '<div class="watch"><b>Watch for:</b> ' + c.watch + '</div>' : '')
    + '<a class="vidbtn" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(c.q) + '" onclick="return openVid(this)">▶ Watch video demo</a>'
    + '<a class="vidbtn alt" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=' + encodeURIComponent(c.q + ' #shorts') + '" onclick="return openVid(this)">⚡ Quick Shorts demo</a>'
    + '<div id="vidTip" class="last" style="display:none;margin-top:8px">If nothing opened: long-press the button and choose “Open in new tab”.</div>'
    + '<div class="nav"><button onclick="navEx(-1)">‹ ' + prevN + '</button><button onclick="navEx(1)">' + nextN + ' ›</button></div>';
}
function stashDraft(){
  if(!PLAN[active]) return;
  try{
    const data = collectDay();
    rawSet(pk(DRAFT_KEY), JSON.stringify({d: todayISO(), day: active, e: data}));
  }catch(e){}
}
function openVid(a){
  stashDraft();
  let w = null;
  try{ w = window.open(a.href, "_blank", "noopener"); }catch(e){}
  if(!w){ const tip = document.getElementById("vidTip"); if(tip) tip.style.display = "block"; }
  return false;
}
const ovl = document.createElement("div");
ovl.id = "ovl";
ovl.innerHTML = '<div id="modal"></div>';
ovl.onclick = e => { if(e.target === ovl) closeEx(); };
document.body.appendChild(ovl);

/* ---------- boot ---------- */
function render(){ active==="X" ? renderCardio() : active==="P" ? renderProgress() : active==="G" ? renderGlp() : renderDay(active); }
(async function(){ await loadProfiles(); buildProfileBar(); renderTabs(); render(); })();
